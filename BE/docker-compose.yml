version: '3.8'

services:
  # 1. Discovery Server (Eureka)
  discovery_server:
    build:
      context: .
      dockerfile: discovery_server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - be-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 6. AI Service
  ai_service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: ai-service
    ports:
      - "8085:8085"
    depends_on:
      discovery_server:
        condition: service_healthy
    networks:
      - be-network
    volumes:
      - ./material_service/Material_Data:/app/material-data:ro
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - AI_DB_URL=${AI_DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - RAG_SOURCE_PATH=/app/material-data

networks:
  be-network:
    driver: bridge
