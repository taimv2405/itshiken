server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024
  tomcat:
    threads:
      max: 40

file:
  base-path: ${FILE_BASE_PATH:../material}

spring:
  application:
    name: itshiken-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 240000
      max-lifetime: 600000
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  cache:
    type: none

  sql:
    init:
      mode: never

  mvc:
    async:
      request-timeout: 120000

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 2592000000

cookie:
  secure: ${COOKIE_SECURE:false}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

llm:
  provider: ${LLM_PROVIDER:gemini}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}

rag:
  ingest:
    source-path: ${RAG_SOURCE_PATH:../material/Material_Data}
    min-chunk-words: 30
  chunk:
    book-size: 300        # words per chunk for book PDFs (WORD_WINDOW)
    book-overlap: 60
    question-size: 230    # words per chunk for exam question PDFs (WORD_WINDOW)
    question-overlap: 45
    semantic:
      buffer-size: 1            # sentences of context to add on each side when embedding
      breakpoint-percentile: 90 # higher = fewer, larger semantic chunks
      min-words: 30             # discard semantic chunks smaller than this
      max-words: 400            # oversized semantic chunks fall back to a word-window split
  embedding:
    batch-size: 32
  retrieval:
    top-k: 6
    chunk-strategy: ${RAG_RETRIEVAL_STRATEGY:WORD_WINDOW}  # WORD_WINDOW | SEMANTIC | ANY

app:
  admin:
    ingest-enabled: ${INGEST_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false
